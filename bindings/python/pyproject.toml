[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "qora-fl"
version = "0.4.0"
description = "Qora: Quorum-Oriented Robust Aggregation for Federated Learning"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
authors = [{name = "Cavin Krenik", email = "cavinkrenik5@icloud.com"}]
license = {text = "MIT OR Apache-2.0"}
keywords = ["federated-learning", "byzantine-tolerance", "machine-learning"]

dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
# Flower is optional: the core bindings are useful without it, and importing
# `qora` succeeds when it is absent. Only `qora.QoraStrategy` requires it, and
# raises an install hint if it is missing.
#
# Upper-bounded because the adapter targets Flower's 1.x strategy interface;
# an unbounded requirement would let a 2.x release break installs silently.
#
# Supported: >=1.5,<2. Tested in CI: 1.5.0 and 1.32.1 (both ends pinned in the
# workflow matrix). Versions in between are covered by the promise but are not
# individually exercised.
flower = ["flwr>=1.5,<2"]

[project.urls]
Homepage = "https://github.com/CavinKrenik/qora-fl"
Repository = "https://github.com/CavinKrenik/qora-fl"

[tool.maturin]
manifest-path = "../../Cargo.toml"
python-source = "."
module-name = "qora._core"
features = ["python"]
